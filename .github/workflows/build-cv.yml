name: Build Resume

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Create output directory
        run: mkdir -p dist

      - name: Generate DOCX (with Word style)
        run: |
          pandoc cv.md -o dist/cv.docx \
            --reference-doc=templates/style.docx

      - name: Copy styles to dist
        run: cp styles/cv.css dist/

      - name: Generate HTML 
        run: |
          pandoc cv.md -o dist/cv.html \
            --standalone \
            --css=cv.css

      - name: Generate PDF from styled HTML
        run: |
          HTML_FILE="$(pwd)/dist/cv.html"
          HTML_URI="file://$HTML_FILE"

          google-chrome \
            --headless \
            --disable-gpu \
            --no-sandbox \
            --no-pdf-header-footer \
            --print-to-pdf-no-header \
            --print-to-pdf="$(pwd)/dist/cv.pdf" \
            "$HTML_URI"

      - name: Upload resume artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: resume-files
          path: dist/

      # TODO: Create an AWS IAM role trusted by GitHub Actions OIDC for this repo
      # and save its ARN in the GitHub secret AWS_ROLE_TO_ASSUME.
      # The role needs permission to put exactly:
      # s3://camelcase-agent-kb-966412459053/cv.md
      - name: Configure AWS credentials
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload source CV Markdown to camelcase-agent knowledge base
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        run: |
          aws s3 cp cv.md s3://camelcase-agent-kb-966412459053/cv.md \
            --content-type "text/markdown; charset=utf-8"

      - name: Note missing AWS OIDC configuration
        if: ${{ env.AWS_ROLE_TO_ASSUME == '' }}
        run: |
          echo "Skipping S3 upload because GitHub secret AWS_ROLE_TO_ASSUME is not configured."
          echo "Create an AWS IAM role trusted by GitHub Actions OIDC for this repo, then store its ARN in AWS_ROLE_TO_ASSUME."

      - name: Prepare deploy directory
        run: |
          mkdir -p deploy-dir/resume
          cp dist/cv.html deploy-dir/resume/resume.html
          cp dist/cv.pdf deploy-dir/resume/resume.pdf
          cp dist/cv.docx deploy-dir/resume/resume.docx
          cp dist/cv.css deploy-dir/resume/cv.css
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          external_repository: mm-camelcase/mm-camelcase.github.io
          publish_branch: main
          publish_dir: ./deploy-dir
          keep_files: true

      
